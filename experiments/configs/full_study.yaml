# Comprehensive CPU study. Run after the default pilot; expect it to take much
# longer because it includes all requested missingness, rank, and gap ablations.
seed: 31
video_path: data/original/v_BabyCrawling_g19_c02.avi
preprocessing:
  size: [96, 96]
  max_frames: 80
  frame_stride: 1
  grayscale: true
completion:
  max_iterations: 30
  tolerance: 0.0001
  initialization: temporal_mean
  ridge: 1.0e-6
experiments:
  - corruption: random
    missing_fractions: [0.10, 0.30, 0.50, 0.70]
  - corruption: block
    missing_fractions: [0.10, 0.30, 0.50]
  - corruption: frames
    gap_lengths: [1, 3, 5, 10]
  - corruption: salt_pepper
    missing_fractions: [0.10, 0.30]
methods: [cp, tucker, temporal_linear, previous, next, spatial]
cp_ranks: [5, 10, 20, 30]
tucker_ranks: [[5, 5, 3], [10, 10, 5], [20, 20, 10], [30, 30, 15]]
save_video: false
